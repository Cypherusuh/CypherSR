<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamOps Player Test</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #player-container {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #audio-status {
      display: none;
      height: 100%;
      align-items: center;
      justify-content: center;
      color: #8be9fd;
      font-size: 18px;
    }

    body.audio-only video { display: none; }
    body.audio-only #audio-status { display: flex; }

    #controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: #181818;
    }

    .input-row, .button-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #222;
      color: #fff;
    }

    button {
      padding: 7px 10px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #292929;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { background: #3a3a3a; }
    button:disabled { opacity: 0.5; cursor: wait; }

    #status {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      color: #ccc;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main id="player-container">
    <video id="video" controls playsinline preload="metadata"></video>
    <div id="audio-status">Audio-only mode</div>
  </main>

  <footer id="controls">
    <form id="prepare-form" class="input-row">
      <input
        id="query"
        type="text"
        placeholder="YouTube URL or search query"
        autocomplete="off"
        required
      >
      <button id="prepare-button" type="submit">Prepare</button>
    </form>

    <div class="button-row">
      <button id="play-button" type="button">Play</button>
      <button id="mode-button" type="button">Audio only</button>
      <span id="status">Enter a YouTube URL or search query.</span>
    </div>
  </footer>

  <script>
    const video = document.querySelector("#video");
    const form = document.querySelector("#prepare-form");
    const queryInput = document.querySelector("#query");
    const prepareButton = document.querySelector("#prepare-button");
    const playButton = document.querySelector("#play-button");
    const modeButton = document.querySelector("#mode-button");
    const status = document.querySelector("#status");

    let audioOnly = false;
    let requestId = 0;

    function setStatus(message) {
      status.textContent = message;
    }

    function updatePlayButton() {
      playButton.textContent = video.paused ? "Play" : "Pause";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const query = queryInput.value.trim();

      if (!query) {
        setStatus("Enter a YouTube URL or search query.");
        return;
      }

      const currentRequest = ++requestId;

      video.pause();
      video.removeAttribute("src");
      video.load();

      prepareButton.disabled = true;
      playButton.disabled = true;
      setStatus("Resolving and converting media. This may take a while...");

      try {
        const response = await fetch("/api/prepare", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ query })
        });

        const result = await response.json();

        if (currentRequest !== requestId) return;

        if (!response.ok) {
          throw new Error(result.error || `Request failed (${response.status})`);
        }

        video.src = result.mediaUrl;
        video.load();

        setStatus(
          `Ready: ${result.title}` +
          (result.uploader ? ` — ${result.uploader}` : "") +
          ". Click Play."
        );
      } catch (error) {
        if (currentRequest !== requestId) return;

        setStatus(`Prepare failed: ${error.message}`);
        console.error("Media preparation failed:", error);
      } finally {
        if (currentRequest === requestId) {
          prepareButton.disabled = false;
          playButton.disabled = false;
        }
      }
    });

    playButton.addEventListener("click", async () => {
      if (video.paused) {
        if (!video.currentSrc) {
          setStatus("Prepare a track first.");
          return;
        }

        try {
          await video.play();
          updatePlayButton();
          setStatus(audioOnly ? "Playing audio" : "Playing video");
        } catch (error) {
          setStatus(`Playback failed: ${error.message}`);
          console.error("Playback failed:", error);
        }
      } else {
        video.pause();
        updatePlayButton();
        setStatus("Paused");
      }
    });

    modeButton.addEventListener("click", () => {
      audioOnly = !audioOnly;

      document.body.classList.toggle("audio-only", audioOnly);
      modeButton.textContent = audioOnly ? "Show video" : "Audio only";

      if (video.currentSrc) {
        setStatus(audioOnly ? "Audio-only mode" : "Video mode");
      }
    });

    video.addEventListener("play", updatePlayButton);
    video.addEventListener("pause", updatePlayButton);

    video.addEventListener("ended", () => {
      updatePlayButton();
      setStatus("Playback ended.");
    });

    video.addEventListener("error", () => {
      const error = video.error;

      setStatus(
        error
          ? `Video failed (code ${error.code}): ${error.message || "No details"}`
          : "Video playback failed."
      );
    });
  </script>
</body>
</html>
