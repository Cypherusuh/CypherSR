
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamOps - Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }
  </style>
</head>
<body>
  <video id="player" playsinline preload="auto"></video>

  <script>
    (() => {
      'use strict';

      const STATE_URL = '/api/player/state';
      const POLL_INTERVAL_MS = 250;
      const DRIFT_CORRECTION_SECONDS = 0.75;
      const MINIMUM_SEEK_SECONDS = 0.15;

      const video = document.getElementById('player');

      let currentRequestId = null;
      let currentMediaUrl = null;
      let polling = false;
      let generation = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      async function waitForMetadata(expectedGeneration) {
        if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
          return;
        }

        await new Promise((resolve, reject) => {
          const cleanup = () => {
            video.removeEventListener('loadedmetadata', onLoaded);
            video.removeEventListener('error', onError);
          };

          const onLoaded = () => {
            cleanup();
            resolve();
          };

          const onError = () => {
            cleanup();
            reject(new Error('Unable to load media metadata.'));
          };

          video.addEventListener('loadedmetadata', onLoaded, { once: true });
          video.addEventListener('error', onError, { once: true });
        });

        if (expectedGeneration !== generation) {
          throw new Error('Media changed while waiting for metadata.');
        }
      }

      function getTargetPosition(playback) {
        const position = Number.isFinite(playback?.position)
          ? Math.max(0, playback.position)
          : 0;

        const duration = Number.isFinite(playback?.duration)
          ? Math.max(0, playback.duration)
          : 0;

        const paused = playback?.paused !== false;
        const updatedAt = Number.isFinite(playback?.updatedAt)
          ? playback.updatedAt
          : 0;

        // Advance the last reported position by elapsed wall-clock time.
        // This keeps the browser close to mpv between telemetry updates.
        const elapsed = !paused && updatedAt > 0
          ? Math.max(0, (Date.now() - updatedAt) / 1000)
          : 0;

        let target = position + elapsed;

        if (duration > 0) {
          // Avoid seeking precisely to the end, which can retrigger
          // the browser's ended state before the next track arrives.
          target = Math.min(target, Math.max(0, duration - 0.1));
        }

        return target;
      }

      async function synchronizePlayback(playback, expectedGeneration) {
        if (expectedGeneration !== generation) return;

        try {
          await waitForMetadata(expectedGeneration);
        } catch {
          return;
        }

        if (expectedGeneration !== generation) return;

        const paused = playback?.paused !== false;
        const volume = Number.isFinite(playback?.volume)
          ? clamp(playback.volume, 0, 1)
          : 1;

        // Do not mute the browser player: OBS needs to capture its audio.
        video.volume = volume;
        video.muted = volume === 0;

        const targetPosition = getTargetPosition(playback);
        const duration = Number.isFinite(video.duration) && video.duration > 0
          ? video.duration
          : 0;

        const safeTarget = duration > 0
          ? clamp(targetPosition, 0, Math.max(0, duration - 0.1))
          : targetPosition;

        const currentPosition = Number.isFinite(video.currentTime)
          ? video.currentTime
          : 0;

        const drift = Math.abs(currentPosition - safeTarget);

        /*
         * Avoid constant seeking. Correct only after a meaningful drift,
         * or when the browser is still at the start of a newly loaded track.
         */
        if (
          drift >= DRIFT_CORRECTION_SECONDS ||
          (currentPosition < MINIMUM_SEEK_SECONDS &&
            safeTarget >= DRIFT_CORRECTION_SECONDS)
        ) {
          try {
            video.currentTime = safeTarget;
          } catch {
            // Metadata or seekability may not be ready yet.
          }
        }

        if (paused) {
          if (!video.paused) {
            video.pause();
          }

          return;
        }

        if (video.paused || video.ended) {
          try {
            await video.play();
          } catch {
            /*
             * Autoplay can be blocked by browser policy. OBS browser
             * sources generally allow autoplay, but this is best-effort.
             */
          }
        }
      }

      function clearCurrentTrack() {
        generation++;
        currentRequestId = null;
        currentMediaUrl = null;

        video.pause();
        video.removeAttribute('src');
        video.load();
      }

      async function pollState() {
        if (polling) return;
        polling = true;

        try {
          const response = await fetch(STATE_URL, {
            cache: 'no-store'
          });

          if (!response.ok) return;

          const state = await response.json();
          const track = state.current;

          if (
            !track ||
            typeof track.requestId !== 'string' ||
            typeof track.mediaUrl !== 'string' ||
            !track.mediaUrl
          ) {
            if (currentRequestId !== null) {
              clearCurrentTrack();
            }

            return;
          }

          const changed =
            track.requestId !== currentRequestId ||
            track.mediaUrl !== currentMediaUrl;

          if (changed) {
            generation++;
            const currentGeneration = generation;

            currentRequestId = track.requestId;
            currentMediaUrl = track.mediaUrl;

            video.pause();
            video.src = track.mediaUrl;
            video.load();

            // Synchronize after the browser has loaded the media metadata.
            void synchronizePlayback(
              state.playback,
              currentGeneration
            );

            return;
          }

          void synchronizePlayback(state.playback, generation);
        } catch {
          // Recover on the next polling cycle.
        } finally {
          polling = false;
        }
      }

      video.addEventListener('error', () => {
        console.error('[StreamOps Player] Browser media playback error.');
      });

      pollState();
      setInterval(pollState, POLL_INTERVAL_MS);
    })();
  </script>
</body>
</html>
