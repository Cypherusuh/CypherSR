<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamOps - Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }
  </style>
</head>
<body>
  <video id="player" playsinline preload="auto"></video>

  <script>
    (() => {
      'use strict';

      const STATE_URL = '/api/player/state';
      const ENDED_URL = '/api/player/ended';
      const TELEMETRY_URL = '/api/player/telemetry';
      const POLL_INTERVAL_MS = 500;
      const TELEMETRY_INTERVAL_MS = 500;

      const video = document.getElementById('player');

      let currentRequestId = null;
      let currentMediaUrl = null;
      let polling = false;
      let generation = 0;
      let endedRequestId = null;
      let lastControlRevision = 0;
      let telemetryInFlight = false;
      let telemetryQueued = false;

      async function postJson(url, payload) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }

        return response;
      }

      async function sendEnded(requestId) {
        try {
          await postJson(ENDED_URL, { requestId });
        } catch {
          // Keep the player alive if the completion notification fails.
        }
      }

      async function sendTelemetry() {
        if (!currentRequestId || video.readyState < HTMLMediaElement.HAVE_METADATA) {
          return;
        }

        if (telemetryInFlight) {
          telemetryQueued = true;
          return;
        }

        telemetryInFlight = true;

        const requestId = currentRequestId;
        const payload = {
          requestId,
          position: Number.isFinite(video.currentTime)
            ? Math.max(0, video.currentTime)
            : 0,
          duration: Number.isFinite(video.duration)
            ? Math.max(0, video.duration)
            : 0,
          volume: video.muted
            ? 0
            : Math.max(0, Math.min(1, video.volume)),
          paused: video.paused
        };

        try {
          await postJson(TELEMETRY_URL, payload);
        } catch {
          // Telemetry is best-effort; the next update can recover.
        } finally {
          telemetryInFlight = false;

          if (telemetryQueued) {
            telemetryQueued = false;

            if (requestId === currentRequestId) {
              void sendTelemetry();
            }
          }
        }
      }

      function waitForMetadata() {
        if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          const cleanup = () => {
            video.removeEventListener('loadedmetadata', onLoaded);
            video.removeEventListener('error', onError);
          };

          const onLoaded = () => {
            cleanup();
            resolve();
          };

          const onError = () => {
            cleanup();
            reject(new Error('Unable to load media metadata.'));
          };

          video.addEventListener('loadedmetadata', onLoaded, { once: true });
          video.addEventListener('error', onError, { once: true });
        });
      }

      async function applyControl(control) {
        if (!control || !Number.isSafeInteger(control.revision)) return;
        if (control.revision <= lastControlRevision) return;

        lastControlRevision = control.revision;

        switch (control.action) {
          case 'play':
            try {
              await video.play();
            } catch {
              // Playback may require a browser interaction.
            }
            break;

          case 'pause':
            video.pause();
            break;

          case 'seek':
            if (Number.isFinite(control.value) && control.value >= 0) {
              try {
                await waitForMetadata();

                if (Number.isFinite(video.duration)) {
                  video.currentTime = Math.max(
                    0,
                    Math.min(control.value, video.duration)
                  );
                }
              } catch {
                // The next control can retry if media failed to load.
              }
            }
            break;

          case 'volume':
            if (Number.isFinite(control.value)) {
              video.volume = Math.max(0, Math.min(1, control.value));
              video.muted = video.volume === 0;
            }
            break;
        }

        void sendTelemetry();
      }

      async function pollState() {
        if (polling) return;
        polling = true;

        try {
          const response = await fetch(STATE_URL, { cache: 'no-store' });
          if (!response.ok) return;

          const state = await response.json();
          const track = state.current;

          if (!track?.requestId || !track?.mediaUrl) {
            if (currentRequestId !== null) {
              generation++;
              currentRequestId = null;
              currentMediaUrl = null;
              endedRequestId = null;

              video.pause();
              video.removeAttribute('src');
              video.load();
            }

            return;
          }

          const changed =
            track.requestId !== currentRequestId ||
            track.mediaUrl !== currentMediaUrl;

          if (changed) {
            const currentGeneration = ++generation;

            currentRequestId = track.requestId;
            currentMediaUrl = track.mediaUrl;
            endedRequestId = null;

            video.pause();
            video.src = track.mediaUrl;
            video.load();

            if (Number.isFinite(state.playback?.volume)) {
              video.volume = Math.max(
                0,
                Math.min(1, state.playback.volume)
              );
              video.muted = video.volume === 0;
            }

            const onMetadata = async () => {
              if (currentGeneration !== generation) return;

              void sendTelemetry();

              // Preserve the existing autoplay behavior for each new track.
              try {
                await video.play();
              } catch {
                // Autoplay may be blocked by the browser.
              }

              void sendTelemetry();
            };

            video.addEventListener('loadedmetadata', onMetadata, { once: true });

            // Handle media that was already loaded.
            if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
              video.removeEventListener('loadedmetadata', onMetadata);
              void onMetadata();
            }
          }

          await applyControl(state.control);
        } catch {
          // Retry on the next polling cycle.
        } finally {
          polling = false;
        }
      }

      video.addEventListener('play', () => void sendTelemetry());
      video.addEventListener('pause', () => void sendTelemetry());
      video.addEventListener('seeked', () => void sendTelemetry());
      video.addEventListener('loadedmetadata', () => void sendTelemetry());
      video.addEventListener('timeupdate', () => void sendTelemetry());

      video.addEventListener('ended', () => {
        const requestId = currentRequestId;

        if (!requestId || endedRequestId === requestId) return;

        endedRequestId = requestId;
        void sendEnded(requestId);
      });

      pollState();
      setInterval(pollState, POLL_INTERVAL_MS);
      setInterval(sendTelemetry, TELEMETRY_INTERVAL_MS);
    })();
  </script>
</body>
</html>
