<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamOps - Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }
  </style>
</head>

<body>
  <video id="player" playsinline preload="auto"></video>

  <script>
    (() => {
      'use strict';

      const STATE_URL = '/api/player/state';
      const ENDED_URL = '/api/player/ended';
      const POLL_INTERVAL_MS = 500;
      const DRIFT_CORRECTION_SECONDS = 2.0;
      const MINIMUM_SEEK_SECONDS = 0.15;

      const video = document.getElementById('player');

      let currentRequestId = null;
      let currentMediaUrl = null;
      let currentSource = 'request';
      let endedRequestId = null;
      let polling = false;
      let generation = 0;

      // Only one synchronization loop may run at a time.
      let synchronizing = false;
      let pendingSynchronization = null;
      let latestPlayback = null;
      let synchronizationRevision = 0;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function requestSynchronization(playback, expectedGeneration) {
        latestPlayback = playback;

        pendingSynchronization = {
          playback,
          generation: expectedGeneration,
          revision: ++synchronizationRevision
        };

        if (!synchronizing) {
          void runSynchronizationLoop();
        }
      }

      async function runSynchronizationLoop() {
        if (synchronizing) return;

        synchronizing = true;

        try {
          while (pendingSynchronization !== null) {
            const job = pendingSynchronization;
            pendingSynchronization = null;

            if (job.generation !== generation) {
              continue;
            }

            await synchronizePlayback(
              job.playback,
              job.generation,
              job.revision
            );
          }
        } finally {
          synchronizing = false;

          // Handle a synchronization request received as the loop ended.
          if (pendingSynchronization !== null) {
            void runSynchronizationLoop();
          }
        }
      }

      async function waitForCanPlay(expectedGeneration) {
        if (video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
          return;
        }

        await new Promise((resolve, reject) => {
          let settled = false;

          const cleanup = () => {
            video.removeEventListener('canplay', onCanPlay);
            video.removeEventListener('error', onError);
            video.removeEventListener('emptied', onEmptied);
          };

          const finish = (callback, value) => {
            if (settled) return;
            settled = true;
            cleanup();
            callback(value);
          };

          const onCanPlay = () => finish(resolve);

          const onError = () => {
            finish(
              reject,
              new Error('Unable to load playable media.')
            );
          };

          const onEmptied = () => {
            finish(
              reject,
              new Error('Media source was cleared.')
            );
          };

          video.addEventListener('canplay', onCanPlay);
          video.addEventListener('error', onError);
          video.addEventListener('emptied', onEmptied);

          // Recheck after registering listeners to avoid missing the event.
          if (video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
            finish(resolve);
          } else if (video.error) {
            onError();
          }
        });

        if (expectedGeneration !== generation) {
          throw new Error('Media changed while waiting for playback readiness.');
        }
      }

      function getTargetPosition(playback) {
        const position = Number.isFinite(playback?.position)
          ? Math.max(0, playback.position)
          : 0;

        const duration = Number.isFinite(playback?.duration)
          ? Math.max(0, playback.duration)
          : 0;

        const paused = playback?.paused !== false;
        const updatedAt = Number.isFinite(playback?.updatedAt)
          ? playback.updatedAt
          : 0;

        // Estimate mpv's current position between telemetry reports.
        const elapsed = !paused && updatedAt > 0
          ? Math.max(0, (Date.now() - updatedAt) / 1000)
          : 0;

        let target = position + elapsed;

        if (duration > 0) {
          target = Math.min(target, Math.max(0, duration - 0.1));
        }

        return target;
      }

      async function synchronizePlayback(
        playback,
        expectedGeneration,
        expectedRevision
      ) {
        if (expectedGeneration !== generation) return;

        try {
          await waitForCanPlay(expectedGeneration);
        } catch (error) {
          if (expectedGeneration === generation) {
            console.debug(
              '[StreamOps Player] Waiting for media metadata:',
              error.message
            );
          }
          return;
        }

        // A newer poll may have arrived while metadata was loading.
        // Never apply the older snapshot after that happens.
        if (
          expectedGeneration !== generation ||
          expectedRevision !== synchronizationRevision
        ) {
          return;
        }

        if (endedRequestId === currentRequestId) return;

        const paused = playback?.paused !== false;
        const volume = Number.isFinite(playback?.volume)
          ? clamp(playback.volume, 0, 1)
          : 1;

        // OBS needs to capture the browser player's audio.
        video.volume = volume;
        video.muted = volume === 0;

        // Default playback loops in the browser, independently of mpv's
        // position telemetry. Seeking it back to mpv's position would fight
        // the loop near the end of each pass.
        if (currentSource !== 'default') {
          const targetPosition = getTargetPosition(playback);
          const duration = Number.isFinite(video.duration) && video.duration > 0
            ? video.duration
            : 0;

          const safeTarget = duration > 0
            ? clamp(targetPosition, 0, Math.max(0, duration - 0.1))
            : targetPosition;

          const currentPosition = Number.isFinite(video.currentTime)
            ? video.currentTime
            : 0;

          const drift = Math.abs(currentPosition - safeTarget);

          // Do not issue repeated currentTime assignments while the browser
          // is already seeking. The seeked event schedules another sync.
          if (!video.seeking && (
            drift >= DRIFT_CORRECTION_SECONDS ||
            (
              currentPosition < MINIMUM_SEEK_SECONDS &&
              safeTarget >= DRIFT_CORRECTION_SECONDS
            )
          )) {
            try {
              console.debug(
                `[StreamOps Player] Correcting position: ` +
                `${currentPosition.toFixed(2)}s -> ${safeTarget.toFixed(2)}s ` +
                `(mpv reported ${Number(playback?.position ?? 0).toFixed(2)}s)`
              );

              video.currentTime = safeTarget;
            } catch (error) {
              console.warn(
                '[StreamOps Player] Position correction failed:',
                error
              );
            }
          }
        }

        if (paused) {
          if (!video.paused) {
            video.pause();
          }

          return;
        }

        if (video.paused || video.ended) {
          try {
            // Don't hold up the synchronization loop on the play promise.
            // A rejected autoplay request is handled separately.
            const playPromise = video.play();

            if (playPromise && typeof playPromise.catch === 'function') {
              void playPromise.catch(error => {
                if (expectedGeneration === generation) {
                  console.warn(
                    '[StreamOps Player] Browser playback could not start:',
                    error
                  );
                }
              });
            }
          } catch (error) {
            console.warn(
              '[StreamOps Player] Browser playback could not start:',
              error
            );
          }
        }
      }

      function clearCurrentTrack() {
        generation++;
        synchronizationRevision++;
        pendingSynchronization = null;
        latestPlayback = null;

        currentRequestId = null;
        currentMediaUrl = null;
        currentSource = 'request';
        endedRequestId = null;
        video.loop = false;

        video.pause();
        video.removeAttribute('src');
        video.load();
      }

      async function pollState() {
        if (polling) return;
        polling = true;

        try {
          const response = await fetch(STATE_URL, {
            cache: 'no-store'
          });

          if (!response.ok) {
            console.warn(
              `[StreamOps Player] State request failed: HTTP ${response.status}`
            );
            return;
          }

          const state = await response.json();
          const track = state.current;

          if (
            !track ||
            typeof track.requestId !== 'string' ||
            typeof track.mediaUrl !== 'string' ||
            !track.mediaUrl
          ) {
            if (currentRequestId !== null) {
              clearCurrentTrack();
            }

            return;
          }

          const changed =
            track.requestId !== currentRequestId ||
            track.mediaUrl !== currentMediaUrl;

          if (changed) {
            generation++;
            synchronizationRevision++;
            pendingSynchronization = null;

            const currentGeneration = generation;

            currentRequestId = track.requestId;
            currentMediaUrl = track.mediaUrl;
            currentSource = track.source === 'default' ? 'default' : 'request';
            endedRequestId = null;
            video.loop = currentSource === 'default';

            video.pause();
            video.src = track.mediaUrl;
            video.load();

            requestSynchronization(
              state.playback,
              currentGeneration
            );

            return;
          }

          requestSynchronization(state.playback, generation);
        } catch (error) {
          console.warn(
            '[StreamOps Player] State polling failed:',
            error
          );
        } finally {
          polling = false;
        }
      }

      video.addEventListener('ended', async () => {
        const requestId = currentRequestId;

        if (
          !requestId ||
          currentSource === 'default' ||
          endedRequestId === requestId
        ) {
          return;
        }

        endedRequestId = requestId;

        try {
          const response = await fetch(ENDED_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requestId })
          });

          if (!response.ok) {
            throw new Error(`Track completion returned ${response.status}`);
          }

          const result = await response.json();

          if (!result.accepted) {
            console.warn(
              '[StreamOps Player] Track completion was not accepted:',
              requestId
            );
          }
        } catch (error) {
          console.warn(
            '[StreamOps Player] Could not notify server that track ended:',
            error
          );
        }
      });

      video.addEventListener('seeked', () => {
        if (
          latestPlayback !== null &&
          currentRequestId !== null
        ) {
          requestSynchronization(latestPlayback, generation);
        }
      });

      video.addEventListener('error', () => {
        console.error(
          '[StreamOps Player] Browser media playback error:',
          {
            code: video.error?.code,
            message: video.error?.message,
            source: video.currentSrc
          }
        );
      });

      video.addEventListener('loadedmetadata', () => {
        if (
          latestPlayback !== null &&
          currentRequestId !== null
        ) {
          requestSynchronization(latestPlayback, generation);
        }
      });

      void pollState();
      setInterval(() => {
        void pollState();
      }, POLL_INTERVAL_MS);
    })();
  </script>
</body>

</html>
