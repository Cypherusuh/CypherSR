
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamOps - Now Playing</title>

  <style>
    :root {
      color-scheme: dark;
      --card-background: rgba(0, 0, 0, 0.78);
      --accent: #58ddff;
      --text: #f2f7fa;
      --muted: #a0aab4;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .card {
      position: relative;
      display: flex;
      align-items: center;
      width: min(300px, 100%);
      height: 104px;
      padding: 12px;
      overflow: hidden;
      border-radius: 7px;
      background: var(--card-background);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .card.is-hidden { display: none; }

    .details {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      gap: 8px;
      padding-bottom: 3px;
    }

    .marquee {
      width: 100%;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee-text {
      display: inline-block;
      width: max-content;
      white-space: nowrap;
      transform: translateX(0);
    }

    .marquee.is-scrolling .marquee-text {
      animation: marquee-scroll var(--scroll-duration, 10s) linear infinite;
      animation-delay: 1s;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .artist {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .duration {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.13);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--accent);
    }

    @keyframes marquee-scroll {
      0%, 10% { transform: translateX(0); }
      90%, 100% { transform: translateX(var(--scroll-distance)); }
    }

    @media (max-width: 240px) {
      .card { padding: 8px; }
      .title { font-size: 12px; }
      .artist { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .marquee.is-scrolling .marquee-text {
        animation: none;
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>
  <main id="card" class="card is-hidden" aria-label="Now playing">
    <section class="details">
      <div id="title-container" class="marquee title">
        <span id="title" class="marquee-text">Untitled track</span>
      </div>

      <div id="artist-container" class="marquee artist">
        <span id="artist" class="marquee-text">Unknown artist</span>
      </div>

      <div class="duration">
        <span id="elapsed">0:00</span>
        <span id="total">0:00</span>
      </div>
    </section>

    <div
      class="progress-track"
      role="progressbar"
      aria-label="Playback progress"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      const STATE_URL = '/api/player/state';
      const POLL_INTERVAL_MS = 500;
      const SCROLL_SPEED_PX_PER_SECOND = 35;
      const SCROLL_PAUSE_SECONDS = 2;

      const card = document.getElementById('card');
      const titleContainer = document.getElementById('title-container');
      const artistContainer = document.getElementById('artist-container');
      const title = document.getElementById('title');
      const artist = document.getElementById('artist');
      const elapsed = document.getElementById('elapsed');
      const total = document.getElementById('total');
      const progressTrack = document.querySelector('.progress-track');
      const progressFill = document.getElementById('progress-fill');

      let polling = false;
      let currentTrackKey = null;
      let playback = null;

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';

        const value = Math.floor(seconds);
        const hours = Math.floor(value / 3600);
        const minutes = Math.floor((value % 3600) / 60);
        const remainder = value % 60;

        return hours > 0
          ? `${hours}:${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`
          : `${minutes}:${String(remainder).padStart(2, '0')}`;
      }

      function configureMarquee(container, textElement) {
        container.classList.remove('is-scrolling');
        textElement.style.removeProperty('--scroll-distance');
        textElement.style.removeProperty('--scroll-duration');

        const overflow = textElement.scrollWidth - container.clientWidth;

        if (overflow <= 2) return;

        const duration =
          overflow / SCROLL_SPEED_PX_PER_SECOND +
          SCROLL_PAUSE_SECONDS * 2;

        textElement.style.setProperty('--scroll-distance', `-${overflow}px`);
        textElement.style.setProperty('--scroll-duration', `${duration}s`);
        container.classList.add('is-scrolling');
      }

      function updateMarquees() {
        configureMarquee(titleContainer, title);
        configureMarquee(artistContainer, artist);
      }

      function showEmpty() {
        card.classList.add('is-hidden');
        currentTrackKey = null;
        playback = null;

        elapsed.textContent = '0:00';
        total.textContent = '0:00';
        progressFill.style.width = '0%';
        progressTrack.setAttribute('aria-valuenow', '0');
      }

      function getPosition() {
        if (!playback) return 0;

        const base = Number.isFinite(playback.position)
          ? playback.position
          : 0;

        const duration = Number.isFinite(playback.duration)
          ? playback.duration
          : 0;

        const updatedAt = Number.isFinite(playback.updatedAt)
          ? playback.updatedAt
          : Date.now();

        const extra = playback.paused
          ? 0
          : Math.max(0, Date.now() - updatedAt) / 1000;

        return Math.max(0, Math.min(base + extra, duration || Infinity));
      }

      function updateProgress() {
        if (!playback || currentTrackKey === null) return;

        const position = getPosition();
        const duration = Number.isFinite(playback.duration)
          ? playback.duration
          : 0;

        elapsed.textContent = formatTime(position);
        total.textContent = formatTime(duration);

        const percentage = duration > 0
          ? Math.min(100, (position / duration) * 100)
          : 0;

        progressFill.style.width = `${percentage}%`;
        progressTrack.setAttribute('aria-valuenow', String(Math.round(percentage)));
      }

      function renderTrack(track, runtime) {
        const key = String(track.requestId ?? track.mediaUrl ?? track.title ?? '');

        if (!key) {
          showEmpty();
          return;
        }

        const isNewTrack = key !== currentTrackKey;
        currentTrackKey = key;
        playback = runtime && runtime.requestId === key
          ? runtime
          : {
              requestId: key,
              position: 0,
              duration: track.duration ?? 0,
              paused: true,
              updatedAt: Date.now()
            };

        card.classList.remove('is-hidden');

        if (isNewTrack) {
          title.textContent = track.title || 'Untitled track';
          artist.textContent = track.uploader || 'Unknown artist';

          title.title = title.textContent;
          artist.title = artist.textContent;

          requestAnimationFrame(updateMarquees);
        }

        updateProgress();
      }

      async function poll() {
        if (polling) return;
        polling = true;

        try {
          const response = await fetch(STATE_URL, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const state = await response.json();

          if (!state.current) {
            showEmpty();
            return;
          }

          renderTrack(state.current, state.playback);
        } catch {
          // Preserve the last known display during temporary API failures.
        } finally {
          polling = false;
        }
      }

      const resizeObserver = new ResizeObserver(updateMarquees);
      resizeObserver.observe(titleContainer);
      resizeObserver.observe(artistContainer);

      poll();
      setInterval(poll, POLL_INTERVAL_MS);
      setInterval(updateProgress, 100);
    })();
  </script>
</body>
</html>
